[project]
name = "frist24-api"
version = "0.1.0"
description = "Frist24 — CRA Article 14 reporting assistant (API)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "cyclonedx-python-lib>=8.0",
  "spdx-tools>=0.8",
  "rapidfuzz>=3.9",
  "packageurl-python>=0.15",
  "reportlab>=4.2",
  "pytest>=8.3",
]

[project.optional-dependencies]
dev = ["pgserver>=0.1.4", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
